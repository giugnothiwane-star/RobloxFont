name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q RobloxFontChanger.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Préparer le SDK Android préinstallé
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: RobloxFontChanger
      - uses: actions/upload-artifact@v4
        with:
          name: RobloxFontChanger-APK
          path: RobloxFontChanger/app/build/outputs/apk/debug/*.apk
